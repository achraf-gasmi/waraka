version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: waraka
      POSTGRES_PASSWORD: waraka
      POSTGRES_DB: waraka
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
