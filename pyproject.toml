[project]
name = "waraka"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.94.0",
    "langgraph>=1.1.2",
    "langchain-anthropic>=0.3.0",
    "google-generativeai>=0.8.0",
    "fastapi>=0.121.2",
    "uvicorn[standard]>=0.35.0",
    "streamlit>=1.40.0",
    "pydantic>=2.10.4",
    "sqlalchemy[asyncio]>=2.0.43",
    "asyncpg>=0.31.0",
    "httpx>=0.27.2",
    "structlog>=25.5.0",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "tools*", "graph*", "models*", "api*", "ui*", "db*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
